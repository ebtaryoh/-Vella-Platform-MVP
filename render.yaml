databases:
  - name: vella-db
    databaseName: vella
    user: vella
    plan: free

services:
  - type: web
    name: vella-api
    env: node
    plan: free
    buildCommand: npm install && cd apps/api && npx prisma generate && npm run build
    startCommand: cd apps/api && npx prisma db push && npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vella-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      - key: NODE_VERSION
        value: 20
